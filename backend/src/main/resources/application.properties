server.port=8080
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

# MySQL Configuration
#
# 下面三行是【本地开发的默认值】，不要为了部署去改它们、也不要再注释切换。
# 部署环境通过环境变量覆盖，Spring Boot 的 relaxed binding 会自动接管，优先级高于本文件：
#   SPRING_DATASOURCE_URL / SPRING_DATASOURCE_USERNAME / SPRING_DATASOURCE_PASSWORD
# 参见 docker-compose.prod.yml 的 backend.environment ——那里已经在这么做了。
# 因此本文件永远保持 localhost，改动它只会污染部署配置并制造冲突。
spring.datasource.url=jdbc:mysql://localhost:3306/aiproject?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&useUnicode=true&characterEncoding=utf8&characterSetResults=utf8&zeroDateTimeBehavior=CONVERT_TO_NULL
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# —— HikariCP 连接池配置（解决连接空闲被关闭的问题）——
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=600000
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.connection-test-query=SELECT 1
spring.datasource.hikari.validation-timeout=5000

spring.sql.init.mode=always
spring.sql.init.encoding=UTF-8
spring.jpa.defer-datasource-initialization=true
jwt.secret=math-homework-secret-key-2024-very-long-string-for-security
jwt.expiration=86400000

# Jackson JSON
spring.jackson.serialization.fail-on-empty-beans=false

# File upload
file.upload-dir=./uploads
file.max-size=5MB
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=20MB

# Logging
logging.level.root=INFO
logging.level.com.example=DEBUG