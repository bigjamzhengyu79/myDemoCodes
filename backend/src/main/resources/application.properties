server.port=8080
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect

# MySQL Configuration
#
# 【本文件不需要再为切换环境而修改】——三种情况已全部覆盖，按下列顺序取值：
#
#   1) DB_HOST / DB_USER / DB_PASSWORD          ← 部分部署环境（如 Render 面板）在用
#   2) SPRING_DATASOURCE_URL / _USERNAME / _PASSWORD
#                                               ← 项目文档的标准写法，
#                                                  见 .env.example、DEPLOYMENT.md、
#                                                  docker-compose.prod.yml
#   3) 都没设 → 落到下面写死的 localhost         ← 本地开发，clone 下来即可直接跑
#
# 语法说明：${A:${B:默认值}} 是 Spring 的嵌套默认值，
# 意为「有 A 用 A，否则有 B 用 B，再否则用默认值」。
# 两套变量名同时兼容是刻意的：部署侧设了哪一套都能连上，
# 避免因面板变量名与本文件不一致而在启动时才发现连不上库。
#
# 注意：这里不能再用裸 ${DB_HOST}（无默认值）——那样本地未设变量时会直接启动失败。
spring.datasource.url=${DB_HOST:${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/mathedu?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true&useUnicode=true&characterEncoding=utf8&characterSetResults=utf8&zeroDateTimeBehavior=CONVERT_TO_NULL}}
spring.datasource.username=${DB_USER:${SPRING_DATASOURCE_USERNAME:root}}
spring.datasource.password=${DB_PASSWORD:${SPRING_DATASOURCE_PASSWORD:root}}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# —— HikariCP 连接池配置（解决连接空闲被关闭的问题）——
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=300000
spring.datasource.hikari.max-lifetime=600000
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.connection-test-query=SELECT 1
spring.datasource.hikari.validation-timeout=5000

spring.sql.init.mode=always
spring.sql.init.encoding=UTF-8
spring.jpa.defer-datasource-initialization=true
jwt.secret=math-homework-secret-key-2024-very-long-string-for-security
jwt.expiration=86400000

# Jackson JSON
spring.jackson.serialization.fail-on-empty-beans=false

# File upload
file.upload-dir=./uploads
file.max-size=5MB
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=20MB

# Logging
logging.level.root=INFO
logging.level.com.example=DEBUG